            updateBoard(board) {
                // Remove existing pieces
                Object.values(this.pieces).forEach(piece => {
                    this.scene.remove(piece);
                });
                this.pieces = {};
                
                // Add pieces based on board state
                for (let row = 0; row < 8; row++) {
                    for (let col = 0; col < 8; col++) {
                        const piece = board[row][col];
                        if (piece) {
                            this.addPiece(piece, row, col);
                        }
                    }
                }
            }
            
            addPiece(pieceType, row, col) {
                const color = pieceType === pieceType.toUpperCase() ? 'white' : 'black';
                const type = pieceType.toLowerCase();
                
                const geometry = this.pieceGeometries[type];
                const material = this.pieceMaterials[color];
                
                const piece = new THREE.Mesh(geometry, material);
                piece.position.set(col - 3.5, 0.4, row - 3.5);
                piece.castShadow = true;
                piece.receiveShadow = true;
                piece.userData = { row, col, piece: pieceType, type: 'piece' };
                
                const key = `${row}-${col}`;
                this.pieces[key] = piece;
                this.scene.add(piece);
            }
            
            highlightSquares(squares, type = 'legal') {
                this.clearHighlights();
                
                squares.forEach(([row, col]) => {
                    const geometry = new THREE.RingGeometry(0.3, 0.45, 16);
                    let material;
                    
                    switch (type) {
                        case 'legal':
                            material = new THREE.MeshBasicMaterial({ 
                                color: 0x00ff00, 
                                transparent: true, 
                                opacity: 0.6 
                            });
                            break;
                        case 'capture':
                            material = new THREE.MeshBasicMaterial({ 
                                color: 0xff0000, 
                                transparent: true, 
                                opacity: 0.6 
                            });
                            break;
                        case 'check':
                            material = new THREE.MeshBasicMaterial({ 
                                color: 0xff4444, 
                                transparent: true, 
                                opacity: 0.8 
                            });
                            break;
                        case 'lastMove':
                            material = new THREE.MeshBasicMaterial({ 
                                color: 0xffff00, 
                                transparent: true, 
                                opacity: 0.4 
                            });
                            break;
                    }
                    
                    const highlight = new THREE.Mesh(geometry, material);
                    highlight.rotation.x = -Math.PI / 2;
                    highlight.position.set(col - 3.5, 0.02, row - 3.5);
                    
                    this.highlightSquares.push(highlight);
                    this.scene.add(highlight);
                });
            }
            
            clearHighlights() {
                this.highlightSquares.forEach(highlight => {
                    this.scene.remove(highlight);
                });
                this.highlightSquares = [];
            }
            
            animateMove(move, onComplete) {
                const fromKey = `${move.from[0]}-${move.from[1]}`;
                const piece = this.pieces[fromKey];
                
                if (!piece) {
                    onComplete();
                    return;
                }
                
                const startPos = piece.position.clone();
                const endPos = new THREE.Vector3(
                    move.to[1] - 3.5,
                    piece.position.y,
                    move.to[0] - 3.5
                );
                
                // Animate piece movement
                const duration = 500 / this.animationSpeed;
                const startTime = Date.now();
                
                const animate = () => {
                    const elapsed = Date.now() - startTime;
                    const progress = Math.min(elapsed / duration, 1);
                    
                    // Smooth easing
                    const eased = 1 - Math.pow(1 - progress, 3);
                    
                    piece.position.lerpVectors(startPos, endPos, eased);
                    piece.position.y = startPos.y + Math.sin(eased * Math.PI) * 0.5; // Arc
                    
                    if (progress < 1) {
                        requestAnimationFrame(animate);
                    } else {
                        piece.position.copy(endPos);
                        piece.position.y = startPos.y;
                        
                        // Update piece key
                        delete this.pieces[fromKey];
                        this.pieces[`${move.to[0]}-${move.to[1]}`] = piece;
                        piece.userData.row = move.to[0];
                        piece.userData.col = move.to[1];
                        
                        onComplete();
                    }
                };
                
                animate();
            }
            
            getIntersectedObject(x, y) {
                this.mouse.x = (x / window.innerWidth) * 2 - 1;
                this.mouse.y = -(y / window.innerHeight) * 2 + 1;
                
                this.raycaster.setFromCamera(this.mouse, this.camera);
                const intersects = this.raycaster.intersectObjects(this.scene.children, true);
                
                return intersects.length > 0 ? intersects[0] : null;
            }
            
            setupEventListeners() {
                window.addEventListener('resize', () => {
                    this.camera.aspect = window.innerWidth / window.innerHeight;
                    this.camera.updateProjectionMatrix();
                    this.renderer.setSize(window.innerWidth, window.innerHeight);
                });
            }
            
            setShadowsEnabled(enabled) {
                this.shadowsEnabled = enabled;
                this.renderer.shadowMap.enabled = enabled;
                
                // Update all lights
                this.scene.traverse(child => {
                    if (child.isDirectionalLight) {
                        child.castShadow = enabled;
                    }
                });
            }
            
            setAnimationSpeed(speed) {
                this.animationSpeed = speed;
            }
            
            animate() {
                requestAnimationFrame(() => this.animate());
                
                this.controls.update();
                this.renderer.render(this.scene, this.camera);
            }
        }

        /**
         * Game UI - Handles DOM interface and user interactions
         */
        class GameUI {
            constructor(engine, renderer, ai) {
                this.engine = engine;
                this.renderer = renderer;
                this.ai = ai;
                
                this.gameMode = 'human'; // 'human' or 'ai'
                this.aiSide = 'black';
                this.isGamePaused = false;
                this.timers = { white: 300, black: 300 }; // 5 minutes each
                this.timerInterval = null;
                this.activeTimer = null;
                
                this.selectedSquare = null;
                this.legalMoves = [];
                this.pendingPromotion = null;
                
                this.init();
            }
            
            init() {
                this.setupEventListeners();
                this.updateUI();
                this.startTimer();
            }
            
            setupEventListeners() {
                // Canvas events
                this.renderer.canvas.addEventListener('click', (e) => this.handleCanvasClick(e));
                this.renderer.canvas.addEventListener('contextmenu', (e) => e.preventDefault());
                
                // UI controls
                document.getElementById('newGameBtn').addEventListener('click', () => this.newGame());
                document.getElementById('undoBtn').addEventListener('click', () => this.undo());
                document.getElementById('redoBtn').addEventListener('click', () => this.redo());
                document.getElementById('flipBoardBtn').addEventListener('click', () => this.flipBoard());
                document.getElementById('pauseBtn').addEventListener('click', () => this.pauseGame());
                document.getElementById('resumeBtn').addEventListener('click', () => this.resumeGame());
                document.getElementById('exportFenBtn').addEventListener('click', () => this.exportFEN());
                document.getElementById('importFenBtn').addEventListener('click', () => this.importFEN());
                document.getElementById('exportPgnBtn').addEventListener('click', () => this.exportPGN());
                
                // Settings
                document.getElementById('gameMode').addEventListener('change', (e) => {
                    this.gameMode = e.target.value;
                    this.updateUI();
                });
                
                document.getElementById('aiSide').addEventListener('change', (e) => {
                    this.aiSide = e.target.value;
                });
                
                document.getElementById('aiDifficulty').addEventListener('change', (e) => {
                    this.ai.setDifficulty(parseInt(e.target.value));
                });
                
                document.getElementById('shadowsEnabled').addEventListener('change', (e) => {
                    this.renderer.setShadowsEnabled(e.target.checked);
                });
                
                document.getElementById('animationSpeed').addEventListener('change', (e) => {
                    this.renderer.setAnimationSpeed(parseFloat(e.target.value));
                });
                
                // Promotion dialog
                document.querySelectorAll('.promotion-piece').forEach(piece => {
                    piece.addEventListener('click', (e) => {
                        this.handlePromotion(e.target.dataset.piece);
                    });
                });
                
                // Keyboard controls
                document.addEventListener('keydown', (e) => this.handleKeyDown(e));
            }
            
            handleCanvasClick(event) {
                if (this.isGamePaused || this.pendingPromotion) return;
                
                const intersect = this.renderer.getIntersectedObject(event.clientX, event.clientY);
                if (!intersect) return;
                
                const userData = intersect.object.userData;
                
                if (userData.type === 'piece') {
                    this.handlePieceClick(userData.row, userData.col);
                } else if (userData.type === 'square') {
                    this.handleSquareClick(userData.row, userData.col);
                }
            }
            
            handlePieceClick(row, col) {
                const piece = this.engine.board[row][col];
                const pieceColor = this.engine.getPieceColor(piece);
                
                if (this.selectedSquare) {
                    // Try to move to this square
                    this.handleSquareClick(row, col);
                } else if (pieceColor === this.engine.currentPlayer) {
                    // Select this piece
                    this.selectPiece(row, col);
                }
            }
            
            handleSquareClick(row, col) {
                if (this.selectedSquare) {
                    const move = this.findMove(this.selectedSquare, [row, col]);
                    if (move) {
                        this.makeMove(move);
                    } else {
                        this.clearSelection();
                    }
                } else {
                    // Select piece if there's one here
                    const piece = this.engine.board[row][col];
                    if (piece && this.engine.getPieceColor(piece) === this.engine.currentPlayer) {
                        this.selectPiece(row, col);
                    }
                }
            }
            
            selectPiece(row, col) {
                this.selectedSquare = [row, col];
                this.legalMoves = this.engine.generatePieceMoves(row, col).filter(move => 
                    !this.engine.moveWouldLeaveInCheck(move, this.engine.currentPlayer)
                );
                
                // Highlight legal moves
                const legalSquares = this.legalMoves.map(move => move.to);
                const captureSquares = this.legalMoves
                    .filter(move => move.type === 'capture' || move.type === 'enpassant')
                    .map(move => move.to);
                
                this.renderer.highlightSquares(legalSquares, 'legal');
                this.renderer.highlightSquares(captureSquares, 'capture');
            }
            
            clearSelection() {
                this.selectedSquare = null;
                this.legalMoves = [];
                this.renderer.clearHighlights();
            }
            
            findMove(from, to) {
                return this.legalMoves.find(move => 
                    move.to[0] === to[0] && move.to[1] === to[1]
                );
            }
            
            makeMove(move) {
                // Check for promotion
                const piece = this.engine.board[move.from[0]][move.from[1]];
                if (piece && piece.toLowerCase() === 'p' && 
                    (move.to[0] === 0 || move.to[0] === 7)) {
                    this.pendingPromotion = move;
                    this.showPromotionDialog();
                    return;
                }
                
                this.executeMove(move);
            }
            
            executeMove(move) {
                this.clearSelection();
                
                // Animate the move
                this.renderer.animateMove(move, () => {
                    this.engine.makeMove(move);
                    this.renderer.updateBoard(this.engine.board);
                    this.updateUI();
                    
                    // Check for AI move
                    if (this.gameMode === 'ai' && this.engine.currentPlayer === this.aiSide && 
                        this.engine.gameState === 'playing') {
                        this.makeAIMove();
                    }
                });
            }
            
            async makeAIMove() {
                this.showLoading(true);
                
                try {
                    const move = await this.ai.getBestMove(this.engine.currentPlayer);
                    if (move) {
                        this.executeMove(move);
                    }
                } catch (error) {
                    console.error('AI move error:', error);
                    this.showToast('AI error occurred');
                } finally {
                    this.showLoading(false);
                }
            }
            
            showPromotionDialog() {
                document.getElementById('promotionDialog').classList.remove('hidden');
            }
            
            hidePromotionDialog() {
                document.getElementById('promotionDialog').classList.add('hidden');
            }
            
            handlePromotion(pieceType) {
                if (!this.pendingPromotion) return;
                
                const color = this.engine.currentPlayer;
                const promotionPiece = color === 'white' ? pieceType.toUpperCase() : pieceType.toLowerCase();
                
                this.pendingPromotion.promotion = promotionPiece;
                this.executeMove(this.pendingPromotion);
                
                this.pendingPromotion = null;
                this.hidePromotionDialog();
            }
            
            newGame() {
                this.engine = new ChessEngine();
                this.renderer.updateBoard(this.engine.board);
                this.clearSelection();
                this.timers = { white: 300, black: 300 };
                this.activeTimer = 'white';
                this.isGamePaused = false;
                this.updateUI();
                this.startTimer();
            }
            
            undo() {
                if (this.engine.unmakeMove()) {
                    this.renderer.updateBoard(this.engine.board);
                    this.clearSelection();
                    this.updateUI();
                }
            }
            
            redo() {
                // Implementation for redo would require storing undone moves
                this.showToast('Redo not implemented');
            }
            
            flipBoard() {
                // Rotate camera around the board
                const currentPosition = this.renderer.camera.position.clone();
                const targetPosition = new THREE.Vector3(-currentPosition.x, currentPosition.y, -currentPosition.z);
                
                // Animate camera movement
                const startPos = currentPosition.clone();
                const duration = 1000;
                const startTime = Date.now();
                
                const animate = () => {
                    const elapsed = Date.now() - startTime;
                    const progress = Math.min(elapsed / duration, 1);
                    const eased = 1 - Math.pow(1 - progress, 3);
                    
                    this.renderer.camera.position.lerpVectors(startPos, targetPosition, eased);
                    this.renderer.controls.update();
                    
                    if (progress < 1) {
                        requestAnimationFrame(animate);
                    }
                };
                
                animate();
            }
            
            pauseGame() {
                this.isGamePaused = true;
                this.stopTimer();
                document.getElementById('pauseBtn').classList.add('hidden');
                document.getElementById('resumeBtn').classList.remove('hidden');
            }
            
            resumeGame() {
                this.isGamePaused = false;
                this.startTimer();
                document.getElementById('pauseBtn').classList.remove('hidden');
                document.getElementById('resumeBtn').classList.add('hidden');
            }
            
            exportFEN() {
                const fen = this.engine.getFEN();
                navigator.clipboard.writeText(fen).then(() => {
                    this.showToast('FEN copied to clipboard');
                });
            }
            
            importFEN() {
                const fen = prompt('Enter FEN string:');
                if (fen) {
                    try {
                        this.engine.loadFEN(fen);
                        this.renderer.updateBoard(this.engine.board);
                        this.clearSelection();
                        this.updateUI();
                        this.showToast('FEN loaded successfully');
                    } catch (error) {
                        this.showToast('Invalid FEN string');
                    }
                }
            }
            
            exportPGN() {
                const pgn = this.engine.exportPGN();
                navigator.clipboard.writeText(pgn).then(() => {
                    this.showToast('PGN copied to clipboard');
                });
            }
            
            startTimer() {
                if (this.timerInterval) clearInterval(this.timerInterval);
                
                this.activeTimer = this.engine.currentPlayer;
                
                this.timerInterval = setInterval(() => {
                    if (!this.isGamePaused && this.engine.gameState === 'playing') {
                        this.timers[this.activeTimer]--;
                        
                        if (this.timers[this.activeTimer] <= 0) {
                            this.showToast(`${this.activeTimer} loses on time!`);
                            this.stopTimer();
                        }
                        
                        this.updateTimerDisplay();
                    }
                }, 1000);
            }
            
            stopTimer() {
                if (this.timerInterval) {
                    clearInterval(this.timerInterval);
                    this.timerInterval = null;
                }
            }
            
            updateTimerDisplay() {
                const formatTime = (seconds) => {
                    const mins = Math.floor(seconds / 60);
                    const secs = seconds % 60;
                    return `${mins}:${secs.toString().padStart(2, '0')}`;
                };
                
                document.getElementById('whiteTimer').textContent = formatTime(this.timers.white);
                document.getElementById('blackTimer').textContent = formatTime(this.timers.black);
                
                // Update active timer highlight
                document.getElementById('whiteTimer').classList.toggle('active', this.activeTimer === 'white');
                document.getElementById('blackTimer').classList.toggle('active', this.activeTimer === 'black');
            }
            
            updateUI() {
                // Update game status
                let status = `${this.engine.currentPlayer === 'white' ? 'White' : 'Black'} to move`;
                if (this.engine.gameState === 'check') {
                    status += ' (in check)';
                } else if (this.engine.gameState === 'checkmate') {
                    status = `Checkmate! ${this.engine.currentPlayer === 'white' ? 'Black' : 'White'} wins`;
                } else if (this.engine.gameState === 'stalemate') {
                    status = 'Stalemate - Draw';
                } else if (this.engine.gameState === 'draw') {
                    status = 'Draw';
                }
                
                document.getElementById('gameStatus').textContent = status;
                
                // Update check indicator
                const checkStatus = document.getElementById('checkStatus');
                if (this.engine.gameState === 'check') {
                    checkStatus.textContent = 'CHECK!';
                    checkStatus.style.color = '#ff4444';
                    
                    // Highlight king in check
                    const kingPos = this.engine.findKing(this.engine.currentPlayer);
                    if (kingPos) {
                        this.renderer.highlightSquares([kingPos], 'check');
                    }
                } else {
                    checkStatus.textContent = '';
                }
                
                // Update move history
                this.updateMoveList();
                
                // Update timer
                this.activeTimer = this.engine.currentPlayer;
                this.updateTimerDisplay();
                
                // Update controls
                document.getElementById('undoBtn').disabled = this.engine.moveHistory.length === 0;
                document.getElementById('aiSide').disabled = this.gameMode === 'human';
                document.getElementById('aiDifficulty').disabled = this.gameMode === 'human';
            }
            
            updateMoveList() {
                const moveList = document.getElementById('moveList');
                moveList.innerHTML = '';
                
                for (let i = 0; i < this.engine.moveHistory.length; i += 2) {
                    const moveNumber = Math.floor(i / 2) + 1;
                    const whiteMove = this.engine.moveHistory[i];
                    const blackMove = this.engine.moveHistory[i + 1];
                    
                    const moveItem = document.createElement('div');
                    moveItem.className = 'move-item';
                    moveItem.innerHTML = `${moveNumber}. ${this.engine.moveToSAN(whiteMove.move)}`;
                    
                    if (blackMove) {
                        moveItem.innerHTML += ` ${this.engine.moveToSAN(blackMove.move)}`;
                    }
                    
                    moveList.appendChild(moveItem);
                }
                
                moveList.scrollTop = moveList.scrollHeight;
            }
            
            handleKeyDown(event) {
                switch (event.key) {
                    case 'Escape':
                        this.clearSelection();
                        break;
                    case 'u':
                        if (event.ctrlKey) {
                            event.preventDefault();
                            this.undo();
                        }
                        break;
                    case 'n':
                        if (event.ctrlKey) {
                            event.preventDefault();
                            this.newGame();
                        }
                        break;
                }
            }
            
            showLoading(show) {
                document.getElementById('loading').classList.toggle('hidden', !show);
            }
            
            showToast(message) {
                const toast = document.createElement('div');
                toast.className = 'toast';
                toast.textContent = message;
                document.body.appendChild(toast);
                
                setTimeout(() => {
                    document.body.removeChild(toast);
                }, 3000);
            }
        }

        /**
         * Main Game Class - Orchestrates all components
         */
        class ChessGame {
            constructor() {
                this.engine = new ChessEngine();
                this.renderer = new Renderer3D(document.getElementById('canvas3d'));
                this.ai = new AIPlayer(this.engine);
                this.ui = new GameUI(this.engine, this.renderer, this.ai);
                
                this.init();
            }
            
            init() {
                // Initial board setup
                this.renderer.updateBoard(this.engine.board);
                
                // Run self-tests
                this.runSelfTests();
                
                console.log('3D Chess Game initialized');
                console.log('Use window.chessGame to access game instance');
                console.log('Run window.chessGame.engine.perft(3) to test move generation');
            }
            
            runSelfTests() {
                console.log('Running chess engine self-tests...');
                
                try {
                    // Test perft at depth 1-3
                    const perftResults = [
                        { depth: 1, expected: 20, actual: this.engine.perft(1) },
                        { depth: 2, expected: 400, actual: this.engine.perft(2) },
                        { depth: 3, expected: 8902, actual: this.engine.perft(3) }
                    ];
                    
                    perftResults.forEach(result => {
                        const status = Math.abs(result.actual - result.expected) <= result.expected * 0.1 ? 'PASS' : 'FAIL';
                        console.log(`Perft(${result.depth}): ${result.actual} (expected ~${result.expected}) - ${status}`);
                    });
                    
                    // Test special moves
                    this.testSpecialMoves();
                    
                    console.log('Self-tests completed');
                } catch (error) {
                    console.error('Self-test error:', error);
                }
            }
            
            testSpecialMoves() {
                // Test castling
                try {
                    this.engine.loadFEN('r3k2r/8/8/8/8/8/8/R3K2R w KQkq - 0 1');
                    const moves = this.engine.getLegalMoves();
                    const castleMoves = moves.filter(m => m.type.includes('castle'));
                    console.log(`Castling test: ${castleMoves.length === 4 ? 'PASS' : 'FAIL'} (found ${castleMoves.length} castle moves)`);
                } catch (error) {
                    console.log('Castling test: FAIL -', error.message);
                }
                
                // Test en passant
                try {
                    this.engine.loadFEN('rnbqkbnr/ppp1p1pp/8/3pPp2/8/8/PPPP1PPP/RNBQKBNR w KQkq f6 0 3');
                    const moves = this.engine.getLegalMoves();
                    const enPassantMoves = moves.filter(m => m.type === 'enpassant');
                    console.log(`En passant test: ${enPassantMoves.length > 0 ? 'PASS' : 'FAIL'} (found ${enPassantMoves.length} en passant moves)`);
                } catch (error) {
                    console.log('En passant test: FAIL -', error.message);
                }
                
                // Test promotion
                try {
                    this.engine.loadFEN('8/P7/8/8/8/8/7p/8 w - - 0 1');
                    const moves = this.engine.getLegalMoves();
                    const promotionMoves = moves.filter(m => m.to[0] === 0 && this.engine.board[m.from[0]][m.from[1]] === 'P');
                    console.log(`Promotion test: ${promotionMoves.length > 0 ? 'PASS' : 'FAIL'} (found ${promotionMoves.length} promotion moves)`);
                } catch (error) {
                    console.log('Promotion test: FAIL -', error.message);
                }
                
                // Reset to starting position
                this.engine.loadFEN('rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1');
            }
        }

        // Initialize the game when page loads
        window.addEventListener('DOMContentLoaded', () => {
            window.chessGame = new ChessGame();
